<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Fluxcord</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="auth"><div class="auth-card"><a class="logo" href="index.html">FLUX<span>CORD</span></a><h1>Welcome Back</h1><p>Log in to your Fluxcord account.</p><form onsubmit="handleLogin(event)"><input id="loginEmail" type="email" placeholder="Email Address" autocomplete="email" required><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn full">Log In</button></form><div class="auth-links"><button type="button" class="btn outline" onclick="forgotEmail()">Forgot Email</button><button type="button" class="btn outline" onclick="sendMagicLink()">Send me sign in link</button></div><small>Don't have an account? <a href="register.html">Create one →</a></small></div></main><script src="js/app.js"></script></body></html>
