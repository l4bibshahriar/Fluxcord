<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Leave a Review — Fluxcord</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="auth"><div class="auth-card"><a class="logo" href="index.html">FLUX<span>CORD</span></a><span class="eyebrow">CUSTOMER REVIEW</span><h1>Share your experience</h1><p>Your review helps other customers choose the right digital resource.</p><div id="reviewFormArea"><label>Rating<select id="reviewRating"><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option></select></label><label>Review<textarea id="reviewText" rows="6" placeholder="Write your review..." required></textarea></label><button class="btn full" onclick="submitReview()">Submit Review →</button></div></div></main><script src="js/app.js"></script><script>async function submitReview(){const u=await requireUser();if(!u)return;const id=new URLSearchParams(location.search).get('order');const text=document.querySelector('#reviewText').value.trim();if(!id||!text)return toast('Enter your review.','error');const sb=await loadSupabase(),{data:items}=await sb.from('order_items').select('product_id').eq('order_id',id).limit(1);if(!items?.[0]?.product_id)return toast('Order item not found.','error');const p=await sb.from('orders').select('status').eq('id',id).eq('user_id',u.id).single();if(p.data?.status!=='delivered')return toast('You can review delivered orders only.','error');const {error}=await sb.from('reviews').insert({user_id:u.id,order_id:id,product_id:items[0].product_id,rating:Number(document.querySelector('#reviewRating').value),review_text:text,reviewer_name:(await currentProfile())?.full_name||u.email?.split('@')[0],is_approved:true});if(error)return toast(error.message,'error');document.querySelector('#reviewFormArea').innerHTML='<div class="panel"><h2>Thank you.</h2><p>Your review has been submitted.</p><a class="btn" href="account.html">Back to account</a></div>'}</script></body></html>
