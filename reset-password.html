<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Fluxcord</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="auth"><div class="auth-card"><a class="logo" href="index.html">FLUX<span>CORD</span></a><h1>Reset Password</h1><p>Choose a new password for your Fluxcord account.</p><form onsubmit="resetPassword(event)"><input id="newPassword" type="password" minlength="6" placeholder="New password" autocomplete="new-password" required><input id="newPassword2" type="password" minlength="6" placeholder="Confirm new password" autocomplete="new-password" required><button class="btn full">Update Password</button></form><small><a href="login.html">Back to login →</a></small></div></main><script src="js/app.js"></script><script>async function resetPassword(e){e.preventDefault();const a=document.querySelector('#newPassword').value,b=document.querySelector('#newPassword2').value;if(a!==b){toast('Passwords do not match.','error');return}const sb=await loadSupabase();if(!sb)return;const {error}=await sb.auth.updateUser({password:a});if(error){toast(error.message,'error');return}toast('Password updated successfully.','success');setTimeout(()=>location.href='login.html',900)}</script></body></html>
